<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pall Mall Dental Support</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

            padding: 0;
        }
        .hero {
            background: white;

        .hero h1 { font-size: 3rem; margin-bottom: 10px; color: #111827; }

        .content h2 { color: #374151; }

    <div class="hero">
        <h1>Welcome to Pall Mall Dental</h1>
        <p>We provide exceptional dental care in London. Have a question? Click the chat bubble in the bottom right!</p>
    </div>

    <div class="content">
        <h2>Our Treatments</h2>
        <p>We offer <strong>Invisalign</strong>, <strong>Teeth Whitening</strong>, <strong>Dental Implants</strong>, and <strong>Hygienist appointments</strong>. Ask our AI assistant about pricing, features, or policies!</p>
