databases:
  - name: ranfie-postgres
    databaseName: ranfie_max
    user: ranfie_admin
    plan: free # Upgrade to Starter ($7/mo) for production

services:
  - type: web
    name: ranfie-rag-max
    env: docker
    plan: starter # MUST be Starter or higher to support Persistent Disks
    disk:
      name: rag-data
      mountPath: /app/chroma_db
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ranfie-postgres
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: AUTH_TOKEN
        sync: false